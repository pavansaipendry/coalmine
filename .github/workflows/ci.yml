name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Deterministic tier only: every test is seeded, so a failure is a real
      # regression, never an unlucky draw. The statistical soak (fresh seeds)
      # runs on manual dispatch.
      - run: pytest -q

  statistical-soak:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m coalmine.experiments.detection_latency --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.sprt_validation --seed ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: experiments/results/

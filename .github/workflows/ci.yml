name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COALMINE_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Deterministic tier only: every test is seeded, so a failure is a real
      # regression, never an unlucky draw. The statistical soak (fresh seeds)
      # runs on manual dispatch. The Postgres store tests run against the
      # service container above; locally they skip unless COALMINE_PG_DSN is set.
      - run: pytest -q

  statistical-soak:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m coalmine.experiments.detection_latency --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.sprt_validation --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.epsilon_verification --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.shadow_overhead --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.full_loop --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.position_bias --seed ${{ github.run_id }}
      - run: python -m coalmine.experiments.judge_calibration --seed ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: experiments/results/

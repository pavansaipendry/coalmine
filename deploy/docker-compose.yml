# The coalmine backing fleet: message bus, event store, and observability.
# The Python services run on the host (or in CI) and connect to these:
#   docker compose -f deploy/docker-compose.yml up -d
#   COALMINE_REDIS_URL=redis://localhost:6379/0
#   COALMINE_PG_DSN=postgresql://coalmine:coalmine@localhost:5432/coalmine
# Prometheus scrapes the fleet's /metrics on host port 9108
# (coalmine.fleet.metrics.serve); Grafana is provisioned with the Prometheus
# datasource and the coalmine dashboard at http://localhost:3000.
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coalmine
      POSTGRES_PASSWORD: coalmine
      POSTGRES_DB: coalmine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coalmine"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

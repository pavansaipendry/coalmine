[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coalmine"
version = "0.1.0"
description = "Automated canary control plane for LLM configs: shadow testing, sequential inference, drift monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["coalmine"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>coalmine</title>
<style>
  :root {
    --surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7;
    --s1: #2a78d6; --s2: #008300; --band: #9ec5f4;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--page); color: var(--ink); padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: var(--ink2); font-size: 13px; margin-bottom: 20px; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--grid);
          border-radius: 8px; padding: 12px 16px; min-width: 130px; }
  .tile .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
                 letter-spacing: 0.04em; }
  .tile .value { font-size: 22px; margin-top: 2px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel { background: var(--surface); border: 1px solid var(--grid);
           border-radius: 8px; padding: 14px 16px; flex: 1; min-width: 340px; }
  .panel h2 { font-size: 13px; color: var(--ink2); margin-bottom: 10px; }
  canvas { width: 100%; height: 120px; }
  ul { list-style: none; font-size: 12.5px; }
  li { padding: 3px 0; border-bottom: 1px solid var(--grid); color: var(--ink2); }
  li b { color: var(--ink); }
  #events li { font-family: ui-monospace, monospace; font-size: 11.5px; }
</style>
</head>
<body>
<h1>coalmine — canary control plane</h1>
<div class="sub">live view · POST /serve to drive traffic · /docs for the API</div>
<div class="tiles">
  <div class="tile"><div class="label">Stage</div><div class="value" id="stage">—</div></div>
  <div class="tile"><div class="label">Challenger share</div><div class="value" id="share">—</div></div>
  <div class="tile"><div class="label">Recent win rate</div><div class="value" id="winrate">—</div></div>
  <div class="tile"><div class="label">Verdicts</div><div class="value" id="verdicts">—</div></div>
  <div class="tile"><div class="label">State</div><div class="value" id="state">—</div></div>
</div>
<div class="row">
  <div class="panel">
    <h2>Rolling challenger win rate (last 500 decisive verdicts)</h2>
    <canvas id="chart" width="640" height="120"></canvas>
  </div>
  <div class="panel">
    <h2>Lifecycle transitions (audit trail)</h2>
    <ul id="transitions"><li>none yet</li></ul>
  </div>
</div>
<div class="row" style="margin-top:16px">
  <div class="panel">
    <h2>Event stream</h2>
    <ul id="events"></ul>
  </div>
</div>
<script>
  const history = [];
  async function refresh() {
    const s = await (await fetch("/state")).json();
    document.getElementById("stage").textContent = s.stage;
    document.getElementById("share").textContent = (s.share * 100).toFixed(0) + "%";
    document.getElementById("winrate").textContent =
      s.recent_win_rate == null ? "—" : (s.recent_win_rate * 100).toFixed(1) + "%";
    document.getElementById("verdicts").textContent = s.verdicts_seen;
    document.getElementById("state").textContent = s.state;
    if (s.recent_win_rate != null) { history.push(s.recent_win_rate); if (history.length > 320) history.shift(); }
    draw();
    const t = document.getElementById("transitions");
    if (s.transitions.length) {
      t.innerHTML = s.transitions.map(x =>
        `<li><b>${x.kind}</b> → ${x.stage} (${(x.share * 100).toFixed(0)}%) @ request ${x.request_index}</li>`
      ).join("");
    }
  }
  function draw() {
    const c = document.getElementById("chart"), ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    const y = v => c.height - ((v - 0.3) / 0.4) * c.height;
    ctx.strokeStyle = "#c3c2b7"; ctx.setLineDash([4, 3]); ctx.beginPath();
    ctx.moveTo(0, y(0.5)); ctx.lineTo(c.width, y(0.5)); ctx.stroke(); ctx.setLineDash([]);
    if (history.length < 2) return;
    ctx.strokeStyle = "#2a78d6"; ctx.lineWidth = 2; ctx.beginPath();
    history.forEach((v, i) => {
      const x = (i / (history.length - 1)) * c.width;
      i ? ctx.lineTo(x, y(v)) : ctx.moveTo(x, y(v));
    });
    ctx.stroke();
  }
  const events = document.getElementById("events");
  const source = new EventSource("/events/stream");
  source.onmessage = (m) => {
    const e = JSON.parse(m.data);
    const li = document.createElement("li");
    li.textContent = `${e.type}  idx=${e.request_index ?? ""}  ${e.winner ? "winner=" + e.winner : ""}${e.kind ? " " + e.kind : ""}`;
    events.prepend(li);
    while (events.children.length > 30) events.removeChild(events.lastChild);
  };
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
